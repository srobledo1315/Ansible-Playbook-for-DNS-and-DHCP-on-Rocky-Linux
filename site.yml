---
- name: Aprovisionamiento de Infraestructura Base (DNS/DHCP)
  hosts: infra_servers
  become: true
  tasks:
    - name: Asegurar que el sistema está actualizado (opcional, comentado por velocidad)
      # ansible.builtin.dnf: name="*" state="latest"
      ansible.builtin.debug:
        msg: "Iniciando despliegue de DNS y DHCP para {{ dns_domain }}"

  roles:
    - role: dns_bind
      tags: ['dns']
    - role: dhcpd
      tags: ['dhcp']
